services:
  db:
    image: postgres:16-alpine
    container_name: northern-meteor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northern_meteor
    ports:
      - "5433:5432"
    volumes:
      - nm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northern_meteor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nm_pg_data:
